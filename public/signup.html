<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規登録</title>
    <script src="https://kit.fontawesome.com/d4772c3c4b.js" crossorigin="anonymous"></script>
    <!-- ブラウザのタブとiPhoneのホーム画面に出すアイコン -->
    <link rel="icon" type="image/png" href="images/wearcast-logo.png">
    <link rel="apple-touch-icon" href="images/wearcast-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script src="auth-form.js"></script>
</head>

<body class="bg-gray-100 min-h-screen">
    <div class="min-h-screen bg-gray-100 flex justify-center">
        <div class="w-full max-w-2xl min-h-screen bg-sky-100 shadow-sm border border-gray-200 flex flex-col">
            <header class="px-6 pt-4 pb-10">
                <a href="welcome.html" class="inline-flex items-center gap-1 text-gray-800 text-sm font-medium hover:opacity-60 transition"><i class="fa-solid fa-arrow-left"></i>戻る</a>
                <h1 class="text-3xl font-medium text-center text-gray-700 mt-2 font-['Zen_Maru_Gothic',sans-serif]">新規登録</h1>
            </header>
            <!-- 水色のヘッダーに、上の角が丸い灰色のパネルを重ねる -->
            <main class="flex-1 bg-gray-50 rounded-t-3xl -mt-4 px-6 pt-8 pb-12">
                <div class="w-full max-w-sm mx-auto">
                    <form id="auth-form" novalidate>
                        <label for="email" class="block text-xs text-gray-600 mb-1">メールアドレス（ログインID）</label>
                        <input id="email" type="email" autocomplete="email" required
                            class="w-full px-4 py-2 mb-6 bg-white border border-gray-400 rounded-full text-base outline-none focus:border-sky-500">

                        <label for="password" class="block text-xs text-gray-600 mb-1">パスワード</label>
                        <div class="relative">
                            <input id="password" type="password" autocomplete="new-password" required minlength="8" maxlength="20"
                                class="w-full pl-4 pr-12 py-2 bg-white border border-gray-400 rounded-full text-base outline-none focus:border-sky-500">
                            <button id="password-toggle" type="button" aria-label="パスワードを表示する"
                                class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-600 hover:opacity-60 transition">
                                <i class="fa-solid fa-eye-slash"></i>
                            </button>
                        </div>
                        <p class="text-xs text-gray-500 mt-2">8〜20字の半角英数字で設定してください。</p>

                        <p id="auth-error" class="text-red-600 text-sm mt-4 min-h-5" role="alert"></p>

                        <button type="submit"
                            class="block w-full max-w-[12rem] mx-auto mt-4 py-3 rounded-full bg-gray-600 text-white font-medium hover:opacity-80 transition disabled:opacity-50">登録する</button>
                    </form>

                    <!-- 線の間に文字を入れた区切り -->
                    <div class="flex items-center gap-2 mt-14 mb-4 text-xs text-gray-600">
                        <span class="flex-1 border-t border-gray-500"></span>
                        その他アカウントを利用して登録
                        <span class="flex-1 border-t border-gray-500"></span>
                    </div>
                    <a href="/auth/google?from=signup"
                        class="flex items-center justify-center gap-2 w-full py-2 bg-white border border-gray-500 text-sm font-medium text-gray-800 hover:bg-gray-100 transition">
                        <svg class="w-4 h-4" viewBox="0 0 48 48" aria-hidden="true">
                            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
                            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
                            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
                            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
                        </svg>
                        Googleで登録
                    </a>
                </div>
            </main>
        </div>
    </div>
    <script>setupAuthForm("/api/signup");</script>
</body>

</html>
