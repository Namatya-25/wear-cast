<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>洋服編集</title>
    <script src="https://kit.fontawesome.com/d4772c3c4b.js" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-100 min-h-screen">
    <div class="min-h-screen bg-gray-100 flex justify-center">
        <div class="w-full max-w-2xl paper-bg shadow-sm border border-gray-200">
            <header class="bg-sky-100 px-6 py-4">
                <a id="back-link" href="list.html" class="inline-flex items-center gap-1 text-gray-800 text-sm font-medium hover:opacity-60 transition"><i class="fa-solid fa-arrow-left"></i>戻る</a>
            </header>
            <main class="px-8 pt-6 pb-10 md:pt-10">
                <h1 class="text-2xl font-medium text-center text-gray-900 mb-6 md:mb-12 font-['Zen_Maru_Gothic',sans-serif]">洋服を編集する</h1>
                <div class="space-y-10">
                    <div>
                        <label class="block text-sm font-medium text-gray-800 mb-3">・画像変更</label>
                        <div class="block md:flex items-start gap-8">
                            <div class="space-y-3 mb-5 md:mb-0">
                                <label
                                    class="flex items-center justify-center w-48 px-4 py-2 bg-[#87ceeb] text-white font-bold rounded cursor-pointer hover:bg-[#6fc0e0] transition">
                                    <span>アップロード</span>
                                    <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" stroke-width="2"
                                        viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round"
                                            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                                    </svg>
                                    <input type="file" id="image" class="hidden" accept="image/*"
                                        onchange="previewImage(event)">
                                </label>

                                <!-- 今の画像を最初から表示しておく -->
                                <div
                                    class="w-40 h-40 border-2 border-black flex items-center justify-center overflow-hidden bg-white">
                                    <img id="preview" src="" alt="プレビュー" class="hidden object-cover w-full h-full">
                                    <span id="placeholder" class="text-xs text-gray-400">No image</span>
                                </div>
                            </div>
                            <div>
                                <div class="w-64">
                                    <select id="category"
                                        class="select-arrow rounded outline-none bg-[#87ceeb] text-white font-bold pl-4 pr-11 py-2 mb-2 inline-block w-full">
                                        <option value="" disabled>カテゴリー選択</option>
                                        <option value="トップス">トップス（Tシャツ、シャツ、ニットなど）</option>
                                        <option value="アウター">アウター（ジャケット、コート、ダウンなど）</option>
                                        <option value="ボトムス">ボトムス（ジーンズ、チノパン、スカートなど）</option>
                                    </select>
                                </div>

                                <div class="w-64">
                                    <select id="temperature"
                                        class="select-arrow rounded outline-none bg-[#87ceeb] text-white font-bold pl-4 pr-11 py-2 inline-block w-full">
                                        <option value="" disabled>温度選択</option>
                                        <option value="暑い日用（25°C以上）">☀️ 暑い日用（25°C以上：半袖など）</option>
                                        <option value="暖かい日用（21°C~24°C）">🍃 暖かい日用（21°C~24°C：長袖シャツなど）</option>
                                        <option value="肌寒い日用（16°C~20°C）">🍁 肌寒い日用（16°C~20°C：パーカー、薄手アウターなど）</option>
                                        <option value="寒い日用（15°C以下）">❄️ 寒い日用（15°C以下：厚手コート、ダウンなど）</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                    </div>
                    <div>
                        <label for="" class="inline-block mb-2">・洋服の名前</label>
                        <input type="text" id="name" placeholder="例）半袖Tシャツ"
                            class="block rounded outline-none border-4 border-[#87ceeb] w-full px-5 py-2">
                    </div>

                    <div class="flex justify-center">
                        <button onclick="update()" class="bg-[#87ceeb] text-white font-bold hover:bg-[#6fc0e0] transition px-9 py-2 rounded-3xl">更新する</button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        //urlから ?id=番号を取得
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");

        //戻るリンクは詳細画面に戻す
        document.getElementById("back-link").href = `detail.html?id=${id}`;

        //今のデータを取得してフォームに入れておく
        fetch(`/api/clothes/${id}`)
            .then(res => res.json())
            .then(item => {
                document.getElementById("name").value = item.name;
                document.getElementById("category").value = item.category || "";
                document.getElementById("temperature").value = item.temperature || "";

                if (item.image_path) {
                    const preview = document.getElementById("preview");
                    preview.src = item.image_path;
                    preview.classList.remove("hidden");
                    document.getElementById("placeholder").classList.add("hidden");
                }
            })
            .catch(err => console.error("データ取得エラー:", err));

        function update() {
            const formData = new FormData();
            formData.append("name", document.getElementById("name").value);
            formData.append("category", document.getElementById("category").value);
            formData.append("temperature", document.getElementById("temperature").value);

            // 画像は新しく選んだときだけ送る（選ばなければ今の画像のまま）
            const imageFile = document.getElementById("image").files[0];
            if (imageFile) {
                formData.append("image", imageFile);
            }

            fetch(`/api/clothes/${id}`, {
                method: "PUT",
                body: formData
            }).then(res => {
                if (!res.ok) {
                    throw new Error("更新に失敗しました");
                }
                alert("更新しました！");
                window.location.href = `detail.html?id=${id}`;
            }).catch((error) => {
                console.error("エラー:", error);
                alert("更新に失敗しました");
            });
        }

        // 選んだ画像をプレビューに表示する
        function previewImage(event) {
            const file = event.target.files[0];
            const preview = document.getElementById("preview");
            const placeholder = document.getElementById("placeholder");

            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    preview.src = e.target.result;
                    preview.classList.remove("hidden");
                    if (placeholder) placeholder.classList.add("hidden");
                }
                reader.readAsDataURL(file);
            }
        }
    </script>
</body>

</html>
