<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一覧画面</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/d4772c3c4b.js" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">
    <div class="min-h-screen bg-gray-100 flex justify-center">
        <div class="w-full max-w-2xl bg-white shadow-sm border border-gray-200">
            <header class="bg-cyan-100 px-6 py-4 flex justify justify-between">
                <a href="index.html" class="text-gray-800 text-sm font-medium hover:underline">←戻る</a>
            </header>
            <main class="px-8 py-10">
                <h1 class="text-2xl font-medium text-center text-gray-900 mb-12">洋服一覧</h1>
                <ul id="clothes-list" class="flex flex-wrap gap-5"></ul>
            </main>
        </div>
    </div>

    <script>
        fetch('/get-clothes')
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('clothes-list');
                data.forEach(item => {
                    const li = document.createElement('li');
                    li.classList.add("card-style");
                    li.textContent = `${item.name} (${item.category})`;

                    // 画像がある場合だけ表示する処理
                    let imgTag = "";
                    if (item.image_path) {
                        imgTag = `<img src="${item.image_path}" style="display: block width: 100%; height: 150px; object-fit: cover;">`;
                    }

                    li.innerHTML = `${imgTag}<p style="text-align: center;">${item.name}</p>`;

                    list.appendChild(li);
                });
            });
    </script>
</body>

</html>
