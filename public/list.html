<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一覧画面</title>
    <!-- ブラウザのタブとiPhoneのホーム画面に出すアイコン -->
    <link rel="icon" type="image/png" href="images/wearcast-logo.png">
    <link rel="apple-touch-icon" href="images/wearcast-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/auth-check.js"></script>
    <script src="js/favorite.js"></script>
    <script src="js/color-picker.js"></script>
    <script src="https://kit.fontawesome.com/d4772c3c4b.js" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">
    <div class="min-h-screen bg-gray-100 flex justify-center">
        <div class="w-full max-w-2xl paper-bg shadow-sm border border-gray-200">
            <header class="bg-sky-100 px-6 py-4 flex justify justify-between">
                <a href="index.html" class="inline-flex items-center gap-1 text-gray-800 text-sm font-medium hover:opacity-60 transition"><i class="fa-solid fa-arrow-left"></i>戻る</a>
            </header>
            <!-- 下の余白は、一番下までスクロールしたときに絞り込むボタンがページ番号に重ならないように広くしている -->
            <main class="px-8 pt-6 pb-28 md:pt-10">
                <h1 class="text-2xl font-medium text-center text-gray-900 mb-6 md:mb-12 font-['Zen_Maru_Gothic',sans-serif]">洋服一覧</h1>
                <!-- 今の絞り込み条件（条件があるときだけ出す） -->
                <div id="filter-summary" class="hidden items-center gap-3 mb-5">
                    <!-- 下線は文字の長さに合わせる（w-fit） -->
                    <div class="flex-1 min-w-0">
                        <p id="filter-summary-text" class="w-fit max-w-full mx-auto text-center font-medium text-gray-900 border-b border-gray-300 pb-0.5 break-words"></p>
                    </div>
                    <button type="button" id="filter-clear" class="shrink-0 bg-[#4FC3F7] text-white text-xs font-bold px-4 py-1.5 rounded-full hover:bg-[#29B6F6] transition">条件クリア</button>
                </div>
                <ul id="clothes-list" class="flex flex-wrap gap-5"></ul>
                <nav id="pagination" class="flex justify-center gap-2 mt-10"></nav>
            </main>
        </div>
    </div>

    <!-- 右下に浮かぶ絞り込むボタン（PCでは画面の中央にある白い枠の右下に合わせる） -->
    <button type="button" id="filter-open"
        class="fixed bottom-4 right-4 md:right-[calc(50%-20rem)] z-30 w-16 h-16 rounded-full bg-gray-800 text-white shadow-lg flex flex-col items-center justify-center gap-1 hover:bg-gray-700 transition">
        <i class="fa-solid fa-sliders"></i>
        <span class="text-[10px] font-bold leading-none">絞り込む</span>
    </button>

    <!-- 絞り込み画面（下から出てくる） -->
    <dialog id="filter-dialog" class="filter-sheet w-full max-w-2xl max-h-full mx-auto mt-auto mb-0 rounded-t-3xl bg-white p-0 backdrop:bg-black/40">
        <form id="filter-form" class="flex flex-col max-h-[100dvh]">
            <!-- 上下の余白は画面の高さに合わせて変える（--filter-spaceはstyle.cssのfilter-sheet） -->
            <div class="relative px-4 py-[var(--filter-space)] text-center">
                <h2 class="text-lg font-medium text-gray-900 font-['Zen_Maru_Gothic',sans-serif]">絞り込む</h2>
                <button type="button" id="filter-close" aria-label="閉じる"
                    class="absolute right-3 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-gray-200 text-gray-800 text-base flex items-center justify-center hover:bg-gray-300 transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="overflow-y-auto flex-1">
                <!-- 名前（入力した文字列を含む服を探す） -->
                <div class="bg-gray-100 px-4 py-[var(--filter-space)]">
                    <label class="flex items-center gap-3 bg-white rounded-lg px-4 py-1.5">
                        <i class="fa-solid fa-magnifying-glass text-gray-400"></i>
                        <input type="search" name="keyword" placeholder="洋服の名前" class="w-full outline-none text-base">
                    </label>
                </div>

                <div class="px-4">
                    <!-- カテゴリー -->
                    <div class="py-[var(--filter-space)] border-b border-gray-200">
                        <p class="text-base mb-2 font-['Zen_Maru_Gothic',sans-serif]">カテゴリー</p>
                        <div class="flex flex-wrap gap-x-4 gap-y-1 text-sm">
                            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="category" value="トップス" class="w-4 h-4 shrink-0 accent-gray-800">トップス</label>
                            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="category" value="アウター" class="w-4 h-4 shrink-0 accent-gray-800">アウター</label>
                            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="category" value="ボトムス" class="w-4 h-4 shrink-0 accent-gray-800">ボトムス</label>
                        </div>
                    </div>

                    <!-- お気に入り -->
                    <label class="flex items-center justify-between py-[var(--filter-space)] text-base border-b border-gray-200 cursor-pointer font-['Zen_Maru_Gothic',sans-serif]">
                        お気に入り
                        <input type="checkbox" name="favorite" class="w-6 h-6 shrink-0 accent-gray-800 cursor-pointer">
                    </label>

                    <!-- 色（丸はcolor-picker.jsで並べる） -->
                    <p class="text-base mt-[var(--filter-space)] mb-1 font-['Zen_Maru_Gothic',sans-serif]">色</p>
                    <div id="filter-color" class="paper-bg rounded p-1.5"></div>

                    <!-- 温度（文字列は登録画面の選択肢と同じにする） -->
                    <p class="text-base mt-[var(--filter-space)] mb-1 font-['Zen_Maru_Gothic',sans-serif]">温度</p>
                    <div class="paper-bg rounded p-1 mb-[var(--filter-space)]">
                        <div class="rounded bg-[#87ceeb] text-white font-bold px-3 py-1">
                            <label class="flex items-start gap-2 py-1 text-sm cursor-pointer">
                                <input type="checkbox" name="temperature" value="暑い日用（25°C以上）" class="mt-0.5 w-4 h-4 shrink-0 accent-white cursor-pointer">
                                <span>☀️ 暑い日用（25°C以上）</span>
                            </label>
                            <label class="flex items-start gap-2 py-1 text-sm cursor-pointer">
                                <input type="checkbox" name="temperature" value="暖かい日用（21°C~24°C）" class="mt-0.5 w-4 h-4 shrink-0 accent-white cursor-pointer">
                                <span>🍃 暖かい日用（21°C~24°C）</span>
                            </label>
                            <label class="flex items-start gap-2 py-1 text-sm cursor-pointer">
                                <input type="checkbox" name="temperature" value="肌寒い日用（16°C~20°C）" class="mt-0.5 w-4 h-4 shrink-0 accent-white cursor-pointer">
                                <span>🍁 肌寒い日用（16°C~20°C）</span>
                            </label>
                            <label class="flex items-start gap-2 py-1 text-sm cursor-pointer">
                                <input type="checkbox" name="temperature" value="寒い日用（15°C以下）" class="mt-0.5 w-4 h-4 shrink-0 accent-white cursor-pointer">
                                <span>❄️ 寒い日用（15°C以下）</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="px-4 py-[var(--filter-space)] border-t border-gray-200">
                <button type="submit" class="w-full bg-[#4FC3F7] text-white font-bold py-2 rounded-3xl hover:bg-[#29B6F6] transition">検索する</button>
            </div>
        </form>
    </dialog>

    <script>
        // 1ページに表示する行数（4行目以降は次のページへ）
        const ROWS_PER_PAGE = 3;
        let clothes = [];
        // 絞り込んだ後の服（一覧とページネーションはこちらを使う）
        let filteredClothes = [];
        let currentPage = 1;
        // 今かかっている絞り込み条件（検索を押す前のチェックは含まない）
        let appliedFilters = [];

        // 1行あたりの枚数（style.cssのcard-styleに合わせる：PCは4枚、768px以下は2枚）
        const mobileQuery = window.matchMedia("(max-width: 768px)");
        function getItemsPerPage() {
            const columns = mobileQuery.matches ? 2 : 4;
            return columns * ROWS_PER_PAGE;
        }

        // 現在のページの服を表示する
        function renderList() {
            const list = document.getElementById("clothes-list");
            list.innerHTML = "";

            if (filteredClothes.length === 0) {
                list.innerHTML = `<li class="w-full text-center text-gray-500 py-10">条件に合う服がありません</li>`;
            }

            const perPage = getItemsPerPage();
            const start = (currentPage - 1) * perPage;
            filteredClothes.slice(start, start + perPage).forEach(item => {
                const li = document.createElement("li");
                li.classList.add("card-style", "relative");

                let imgTag = "";
                if (item.image_path) {
                    imgTag = `<img src="${item.image_path}" style="display: block; width: 100%; height: 150px; object-fit: cover;">`;
                }

                li.innerHTML = `
                        <a href="detail.html?id=${item.id}" class="block p-2 border rounded         hover:bg-sky-200 transition ease-in">
                        ${imgTag}<p class="clothes-name mt-2" style="text-align: center;"></p>
                    </a>
                    ${item.is_favorite ? favoriteMarkHtml("absolute top-3 right-3") : ""}`;
                // 名前は自分で入力したものなので、HTMLとして読まれないようにtextContentで入れる（<script>などを入れられても動かない）
                li.querySelector(".clothes-name").textContent = item.name;

                list.appendChild(li);
            });

            renderPagination();

            // 詳細画面から戻ったときに同じ表示にできるように、条件とページを覚えておく
            sessionStorage.setItem("listState", JSON.stringify({ filters: appliedFilters, page: currentPage }));
        }

        // ページネーションのボタンを表示する
        function renderPagination() {
            const pagination = document.getElementById("pagination");
            pagination.innerHTML = "";

            const totalPages = Math.ceil(filteredClothes.length / getItemsPerPage());
            // 1ページに収まる場合はページネーションを出さない
            if (totalPages <= 1) return;

            const createButton = (label, page, disabled, active) => {
                const button = document.createElement("button");
                button.textContent = label;
                button.disabled = disabled;
                // 矢印（‹ ›）だけ文字を大きくする（ページ番号は数字で渡される）
                button.className = "w-9 h-9 flex items-center justify-center rounded-full border "
                    + (typeof label === "string" ? "text-2xl leading-none pb-1 " : "")
                    + (active ? "bg-sky-100 border-sky-300 font-medium" : "bg-white border-gray-300 hover:bg-gray-100")
                    + (disabled ? " opacity-40 cursor-not-allowed" : "");
                button.addEventListener("click", () => {
                    currentPage = page;
                    renderList();
                    window.scrollTo({ top: 0 });
                });
                pagination.appendChild(button);
            };

            createButton("‹", currentPage - 1, currentPage === 1, false);
            // ページ番号は3つまで出す（今のページが真ん中に来るようにずらす）
            const firstPage = Math.max(1, Math.min(currentPage - 1, totalPages - 2));
            const lastPage = Math.min(totalPages, firstPage + 2);
            for (let page = firstPage; page <= lastPage; page++) {
                createButton(page, page, false, page === currentPage);
            }
            createButton("›", currentPage + 1, currentPage === totalPages, false);
        }

        // 画面幅が変わって1行の枚数が変わったら、1ページ目から表示し直す
        mobileQuery.addEventListener("change", () => {
            currentPage = 1;
            renderList();
        });

        // フォームの条件で服を絞り込む（同じ項目の中はどれか1つに一致・違う項目の間はすべてに一致）
        const filterDialog = document.getElementById("filter-dialog");
        const filterForm = document.getElementById("filter-form");

        function applyFilters() {
            const form = new FormData(filterForm);
            appliedFilters = [...form.entries()];
            const keyword = form.get("keyword").trim().toLowerCase();
            const categories = form.getAll("category");
            const colors = form.getAll("color");
            const temperatures = form.getAll("temperature");
            const favoriteOnly = form.has("favorite");


            filteredClothes = clothes.filter(item => {
                if (keyword && !item.name.toLowerCase().includes(keyword)) return false;
                if (categories.length && !categories.includes(item.category)) return false;
                if (colors.length && !colors.includes(item.color)) return false;
                if (favoriteOnly && !item.is_favorite) return false;
                if (temperatures.length) {
                    // 温度はカンマ区切りで複数入っている
                    const itemTemperatures = (item.temperature || "").split(",");
                    if (!temperatures.some(t => itemTemperatures.includes(t))) return false;
                }
                return true;
            });

            // 今の条件を一覧の上に出す（温度は「暑い日用（25°C以上）」のかっこを省く）
            const labels = [
                ...(keyword ? [form.get("keyword").trim()] : []),
                ...categories,
                ...(favoriteOnly ? ["お気に入り"] : []),
                ...colors,
                ...temperatures.map(t => t.split("（")[0])
            ];
            const summary = document.getElementById("filter-summary");
            summary.classList.toggle("hidden", labels.length === 0);
            summary.classList.toggle("flex", labels.length > 0);
            document.getElementById("filter-summary-text").textContent = labels.join(" / ");

            // 絞り込むと件数が変わるので1ページ目に戻す
            currentPage = 1;
            renderList();
        }

        // 条件クリア：絞り込み画面の選択も全部外して全件に戻す
        document.getElementById("filter-clear").addEventListener("click", () => {
            filterForm.reset();
            applyFilters();
        });

        renderColorFilter("filter-color");

        document.getElementById("filter-open").addEventListener("click", () => {
            filterDialog.showModal();
            // 開いている間は後ろの一覧がスクロールしないようにする
            document.body.classList.add("overflow-hidden");
        });

        // 下に下がるアニメーションが終わってから閉じる（動きを減らす設定のときはアニメーションが無いのですぐ閉じる）
        function closeFilterSheet() {
            if (filterDialog.classList.contains("closing")) return;
            filterDialog.classList.add("closing");
            Promise.allSettled(filterDialog.getAnimations().map(animation => animation.finished)).then(() => {
                filterDialog.close();
                filterDialog.classList.remove("closing");
            });
        }

        document.getElementById("filter-close").addEventListener("click", closeFilterSheet);
        // 暗くなった部分を押しても閉じる
        filterDialog.addEventListener("click", (event) => {
            if (event.target === filterDialog) closeFilterSheet();
        });
        // Escキーでも同じように閉じる
        filterDialog.addEventListener("cancel", (event) => {
            event.preventDefault();
            closeFilterSheet();
        });
        filterDialog.addEventListener("close", () => document.body.classList.remove("overflow-hidden"));

        // 検索するボタン（名前の入力中のEnterキーも同じ）
        filterForm.addEventListener("submit", (event) => {
            event.preventDefault();
            applyFilters();
            closeFilterSheet();
            window.scrollTo({ top: 0 });
        });

        // 覚えておいた条件を絞り込み画面のフォームに入れ直す
        function restoreFilterForm(filters) {
            filters.forEach(([name, value]) => {
                const input = [...filterForm.elements].find(el => el.name === name && (el.type !== "checkbox" || el.value === value));
                if (!input) return;
                if (input.type === "checkbox") input.checked = true;
                else input.value = value;
            });
        }

        // 詳細画面から戻ったとき・ブラウザの戻るや再読み込みのときは、前の絞り込みとページに戻す（ホームや登録画面から来たときは全件を出す）
        const navigationType = performance.getEntriesByType("navigation")[0].type;
        const savedState = navigationType !== "navigate" || document.referrer.includes("detail.html")
            ? JSON.parse(sessionStorage.getItem("listState"))
            : null;

        fetch("/get-clothes")
            .then(res => res.json())
            .then(data => {
                clothes = data;
                if (savedState) restoreFilterForm(savedState.filters);
                applyFilters();
                if (savedState) {
                    // 削除などでページが減っていたら最後のページにする
                    const totalPages = Math.ceil(filteredClothes.length / getItemsPerPage());
                    currentPage = Math.max(1, Math.min(savedState.page, totalPages));
                    renderList();
                }
            });
    </script>
</body>

</html>
