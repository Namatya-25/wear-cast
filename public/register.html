<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>洋服登録</title>
    <script src="https://kit.fontawesome.com/d4772c3c4b.js" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-100 min-h-screen">
    <div class="min-h-screen bg-gray-100 flex justify-center">
        <div class="w-full max-w-2xl paper-bg shadow-sm border border-gray-200">
            <header class="bg-sky-100 px-6 py-4">
                <a href="index.html" class="inline-flex items-center gap-1 text-gray-800 text-sm font-medium hover:opacity-60 transition"><i class="fa-solid fa-arrow-left"></i>戻る</a>
            </header>
            <main class="px-8 pt-4 pb-10 md:pt-6">
                <h1 class="text-2xl font-medium text-center text-gray-900 mb-5 md:mb-8 font-['Zen_Maru_Gothic',sans-serif]">新しい服を登録する</h1>
                <div class="space-y-10">
                    <div>
                        <div class="block md:flex items-start gap-8">
                            <div class="space-y-3 mb-5 md:mb-0">
                                <!-- 【書き直し1】labelで囲み、カスタムボタンのデザインにする -->
                                <label
                                    class="flex items-center justify-center w-48 px-4 py-2 bg-[#87ceeb] text-white font-bold rounded cursor-pointer hover:bg-[#6fc0e0] transition">
                                    <span>写真をアップロード</span>
                                    <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" stroke-width="2"
                                        viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round"
                                            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                                    </svg>

                                    <!-- 【書き直し2】hiddenとonchangeを追加 -->
                                    <input type="file" id="image" class="hidden" accept="image/*"
                                        onchange="previewImage(event)">
                                </label>

                                <!-- 【書き直し3】プレビュー枠の大きさを指定し、id="preview" を追加 -->
                                <div
                                    class="w-40 h-40 border-2 border-black flex items-center justify-center overflow-hidden bg-white">
                                    <img id="preview" src="" alt="プレビュー" class="hidden object-cover w-full h-full">
                                    <span id="placeholder" class="text-xs text-gray-400">No image</span>
                                </div>
                            </div>
                            <div>
                                <div class="w-64">
                                    <select id="category"
                                        class="select-arrow rounded outline-none bg-[#87ceeb] text-white font-bold pl-4 pr-11 py-2 mb-2 inline-block w-full">
                                        <option value="" selected disabled>カテゴリー選択</option>
                                        <option value="トップス">トップス（Tシャツ、シャツ、ニットなど）</option>
                                        <option value="アウター">アウター（ジャケット、コート、ダウンなど）</option>
                                        <option value="ボトムス">ボトムス（ジーンズ、チノパン、スカートなど）</option>
                                    </select>
                                </div>

                                <div class="w-64">
                                    <select id="temperature"
                                        class="select-arrow rounded outline-none bg-[#87ceeb] text-white font-bold pl-4 pr-11 py-2 inline-block w-full">
                                        <!-- 初期表示用（選択はできないようにする） -->
                                        <option value="" selected disabled>温度選択</option>
                                        <option value="暑い日用（25°C以上）">☀️ 暑い日用（25°C以上：半袖など）</option>
                                        <option value="暖かい日用（21°C~24°C）">🍃 暖かい日用（21°C~24°C：長袖シャツなど）</option>
                                        <option value="肌寒い日用（16°C~20°C）">🍁 肌寒い日用（16°C~20°C：パーカー、薄手アウターなど）</option>
                                        <option value="寒い日用（15°C以下）">❄️ 寒い日用（15°C以下：厚手コート、ダウンなど）</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                    </div>
                    <div>
                        <label for="name" class="inline-block text-base font-medium text-gray-800 mb-2 font-['Zen_Maru_Gothic',sans-serif]">洋服の名前</label>
                        <input type="text" id="name" placeholder="例）半袖Tシャツ"
                            class="block rounded outline-none border-4 border-[#87ceeb] w-full px-5 py-2">
                    </div>

                    <div class="flex justify-center">
                        <button onclick="save()" class="bg-[#87ceeb] text-white font-bold hover:bg-[#6fc0e0] px-9 py-2 rounded-3xl transition">登録する</button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        function save() {
            // 画像ファイルを取得
            const imageFile = document.getElementById("image").files[0];

            // 画像が選択されているかチェック
            if (!imageFile) {
                alert("画像を選択してください！");
                return; // ここで処理を止める
            }

            // 必須項目（名前・服の種類・温度）が入力されているかチェック
            const name = document.getElementById("name").value.trim();
            const category = document.getElementById("category").value;
            const temperature = document.getElementById("temperature").value;

            if (!category) {
                alert("カテゴリーを選択してください！");
                return;
            }
            if (!temperature) {
                alert("温度を選択してください！");
                return;
            }
            if (!name) {
                alert("洋服の名前を入力してください！");
                return;
            }

            // FormDataを使うことで、画像とテキストを一緒に送れます
            const formData = new FormData();
            formData.append("name", name);
            formData.append("category", category);
            formData.append("image", imageFile);
            formData.append("temperature", temperature);



            // fetchで送信（※重要：headersのContent-Typeは「書かない」のがコツです）
            fetch("/add-clothes", {
                method: "POST",
                body: formData
            }).then((res) => {
                // サーバー側でエラーになった場合はここで止める
                if (!res.ok) {
                    return res.text().then((message) => alert(message));
                }
                alert("登録しました！");
                window.location.href = "list.html";
            }).catch((error) => {
                console.error("エラー:", error);
                alert("登録に失敗しました");
            });
        }


        // 画像登録の写真を表示する
        function previewImage(event) {
            // 選択した画像ファイルのデータを取得
            const file = event.target.files[0];

            //imgタグを取得
            const preview = document.getElementById("preview");

            //spanタグを取得
            const placeholder = document.getElementById("placeholder");

            //ファイルが選択されたか確認
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    preview.src = e.target.result;
                    preview.classList.remove("hidden");
                    if (placeholder) placeholder.classList.add("hidden");
                }

                //filereaderを動かすための命令
                reader.readAsDataURL(file);
            }
        }

    </script>
</body>

</html>
