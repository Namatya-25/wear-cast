<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>洋服登録</title>
    <script src="https://kit.fontawesome.com/d4772c3c4b.js" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">
    <div class="min-h-screen bg-gray-100 flex justify-center">
        <div class="w-full max-w-2xl bg-white shadow-sm border
        border-gray-200">
            <header class="bg-cyan-100 px-6 py-4">
                <a href="list.html" class="text-gray-800 text-sm font-medium hover:underline">←戻る</a>
            </header>
            <main class="px-8 py-10">
                <h1 class="text-2xl font-medium text-center text-gray-900 mb-12">新しい服を登録する</h1>
                <div class="space-y-10">
                    <div>
                        <label class="block text-sm font-medium text-gray-800 mb-3">・画像登録</label>
                        <div class="block md:flex items-start gap-8">
                            <div class="space-y-3 mb-5 md:mb-0">
                                <input type="file" id="image">
                                <div>
                                    <img src="" alt="">
                                </div>
                            </div>
                            <div>
                                <div class="w-64">
                                    <select id="category" class="outline-none bg-gray-300 px-4 py-2 mb-2 inline-block w-full">
                                        <option value="" selected disabled>カテゴリー選択</option>
                                        <option value="トップス">トップス（Tシャツ、シャツ、ニットなど）</option>
                                        <option value="アウター">アウター（ジャケット、コート、ダウンなど）</option>
                                        <option value="ボトムス">ボトムス（ジーンズ、チノパン、スカートなど）</option>
                                    </select>
                                </div>

                                <div class="w-64">
                                    <select id="temperature" class="outline-none bg-gray-300 px-4 py-2 inline-block w-full">
                                        <!-- 初期表示用（選択はできないようにする） -->
                                        <option value="" selected disabled>温度選択</option>
                                        <option value="暑い日用（25°C以上）">☀️ 暑い日用（25°C以上：半袖など）</option>
                                        <option value="暖かい日用（21°C~24°C）">🍃 暖かい日用（21°C~24°C：長袖シャツなど）</option>
                                        <option value="肌寒い日用（16°C~20°C）">🍁 肌寒い日用（16°C~20°C：パーカー、薄手アウターなど）</option>
                                        <option value="寒い日用（15°C以下）">❄️ 寒い日用（15°C以下：厚手コート、ダウンなど）</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                    </div>
                    <div>
                        <label for="" class="inline-block mb-2">・洋服の名前</label>
                        <input type="text" id="name" placeholder="例）半袖Tシャツ" class="block outline-none border-4 border-gray-400 w-full px-5 py-2">
                    </div>

                    <div class="flex justify-center">
                        <button onclick="save()" class="bg-gray-300 px-9 py-2 rounded-3xl">登録する</button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        function save() {
            // 画像ファイルを取得
            const imageFile = document.getElementById("image").files[0];

            // 画像が選択されているかチェック
            if (!imageFile) {
                alert("画像を選択してください！");
                return; // ここで処理を止める
            }

            // FormDataを使うことで、画像とテキストを一緒に送れます
            const formData = new FormData();
            formData.append("name", document.getElementById("name").value);
            formData.append("category", document.getElementById("category").value);
            formData.append("image", imageFile);
            formData.append("temperature", document.getElementById("temperature").value);



            // fetchで送信（※重要：headersのContent-Typeは「書かない」のがコツです）
            fetch("/add-clothes", {
                method: "POST",
                body: formData
            }).then(() => {
                alert("登録しました！");
                window.location.href = "list.html";
            }).catch((error) => {
                console.error("エラー:", error);
                alert("登録に失敗しました");
            });
        }
    </script>
</body>

</html>
