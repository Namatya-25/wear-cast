<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>詳細画面</title>
    <script src="https://kit.fontawesome.com/d4772c3c4b.js" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">
    <div class="min-h-screen bg-gray-100 flex justify-center">
        <div class="w-full max-w-2xl bg-[#FBF7EF] shadow-sm border border-gray-200">
            <header class="bg-cyan-100 px-6 py-4 flex justify justify-between">
                <a href="list.html" class="text-gray-800 text-sm font-medium hover:underline">←戻る</a>
            </header>
            <main class="px-8 py-10">
                <h1 class="text-2xl font-medium text-center text-gray-900 mb-12">洋服の詳細</h1>

                <!-- データ表示エリア -->
                <div id="detail-container" class="flex flex-col items-center gap-7 md:flex-row md:items-start">
                    <div class="w-60 h-60 shrink-0">
                        <img id="detail-image" class="w-full h-full object-cover border-2 border-gray-300 rounded"
                            src="" alt="画像">
                    </div>
                    <div class="w-full md:w-auto md:mt-4">
                        <div class="md:mt-7">
                            <h2 id="detail-name" class="text-2xl font-bold pb-4"></h2>
                            <h2 id="detail-category" class="text-2xl font-bold pb-4"></h2>
                            <h2 id="detail-temperature" class="text-2xl font-bold"></h2>
                        </div>
                        <div class="flex justify-center md:justify-end gap-4 md:gap-7 mt-10 md:mt-20">
                            <div class="flex justify-center">
                                <button onclick="goEdit()" class="bg-gray-300 px-6 md:px-9 py-2 rounded-3xl whitespace-nowrap">編集する</button>
                            </div>
                            <div class="flex justify-center">
                                <button onclick="deleteItem()" class="bg-gray-300 px-6 md:px-9 py-2 rounded-3xl whitespace-nowrap">
                                    <span class="text-red-600">削除</span>する
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

            </main>
            <script>
                //urlから ?id=番号を取得
                const params = new URLSearchParams(window.location.search);
                const id = params.get("id");

                //サーバーからそのidのデータを取得(server.jsの/api/clothes/:idに対応)
                fetch(`/api/clothes/${id}`)
                    .then(res => res.json())
                    .then(item => {
                        document.getElementById("detail-image").src = item.image_path;
                        document.getElementById('detail-name').textContent = "名前:" + item.name;
                        document.getElementById('detail-category').textContent = "カテゴリー: " + item.category;
                        document.getElementById('detail-temperature').textContent = item.temperature;
                    })

                    .catch(err => console.error("データ取得エラー:", err));

                //編集画面へ移動（idを渡す）
                function goEdit() {
                    window.location.href = `edit.html?id=${id}`;
                }

                //削除して一覧画面へ戻る(server.jsのDELETE /api/clothes/:idに対応)
                function deleteItem() {
                    if (!confirm("この洋服を削除しますか？")) return;

                    fetch(`/api/clothes/${id}`, { method: "DELETE" })
                        .then(res => {
                            if (!res.ok) throw new Error("削除に失敗しました");
                            window.location.href = "list.html";
                        })
                        .catch(err => {
                            console.error("削除エラー:", err);
                            alert("削除に失敗しました");
                        });
                }
            </script>
</body>

</html>
