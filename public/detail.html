<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>詳細画面</title>
    <script src="https://kit.fontawesome.com/d4772c3c4b.js" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="favorite.js"></script>
</head>

<body class="bg-gray-100 min-h-screen">
    <div class="min-h-screen bg-gray-100 flex justify-center">
        <div class="w-full max-w-2xl paper-bg shadow-sm border border-gray-200">
            <header class="bg-sky-100 px-6 py-4 flex justify justify-between">
                <a href="list.html" class="inline-flex items-center gap-1 text-gray-800 text-sm font-medium hover:opacity-60 transition"><i class="fa-solid fa-arrow-left"></i>戻る</a>
            </header>
            <main class="px-8 pt-6 pb-10 md:pt-10">
                <h1 class="text-2xl font-medium text-center text-gray-900 mb-6 md:mb-12 font-['Zen_Maru_Gothic',sans-serif]">洋服の詳細</h1>

                <!-- データ表示エリア -->
                <div id="detail-container" class="flex flex-col items-center gap-7 md:flex-row md:items-start">
                    <div id="detail-image-box" class="relative w-60 h-60 shrink-0">
                        <img id="detail-image" class="w-full h-full object-cover border-2 border-gray-300 rounded"
                            src="" alt="画像">
                        <!-- お気に入りの星ボタンはデータ取得後にここへ入れる -->
                    </div>
                    <div class="w-full md:w-auto">
                        <!-- 名前・カテゴリー・温度を表のように線で区切って表示 -->
                        <table class="w-full border-collapse border-y-2 border-[#87ceeb]">
                            <tr class="border-b-2 border-[#87ceeb]">
                                <th class="text-right text-base font-medium text-gray-600 py-4 pl-3 pr-6 whitespace-nowrap">名前<span class="ml-1">:</span></th>
                                <td id="detail-name" class="text-2xl font-bold py-4"></td>
                            </tr>
                            <tr class="border-b-2 border-[#87ceeb]">
                                <th class="text-right text-base font-medium text-gray-600 py-4 pl-3 pr-6 whitespace-nowrap">カテゴリー<span class="ml-1">:</span></th>
                                <td id="detail-category" class="text-2xl font-bold py-4"></td>
                            </tr>
                            <tr>
                                <th class="text-right text-base font-medium text-gray-600 py-4 pl-3 pr-6 whitespace-nowrap">温度<span class="ml-1">:</span></th>
                                <td id="detail-temperature" class="text-xl font-bold py-4"></td>
                            </tr>
                        </table>
                        <div class="flex justify-center md:justify-end gap-4 md:gap-7 mt-10 md:mt-20">
                            <div class="flex justify-center">
                                <button onclick="goEdit()" class="bg-[#87ceeb] text-white font-bold hover:bg-[#6fc0e0] transition px-6 md:px-9 py-2 rounded-3xl whitespace-nowrap">編集する</button>
                            </div>
                            <div class="flex justify-center">
                                <button onclick="deleteItem()" class="bg-[#87ceeb] text-white font-bold hover:bg-[#6fc0e0] transition px-6 md:px-9 py-2 rounded-3xl whitespace-nowrap">
                                    <span class="text-red-600">削除</span>する
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

            </main>
            <script>
                //urlから ?id=番号を取得
                const params = new URLSearchParams(window.location.search);
                const id = params.get("id");

                //サーバーからそのidのデータを取得(server.jsの/api/clothes/:idに対応)
                fetch(`/api/clothes/${id}`)
                    .then(res => res.json())
                    .then(item => {
                        document.getElementById("detail-image").src = item.image_path;
                        document.getElementById('detail-name').textContent = item.name;
                        document.getElementById('detail-category').textContent = item.category;
                        document.getElementById('detail-temperature').textContent = item.temperature;
                        // 画像の右上にお気に入りの星ボタンを置く（favorite.js）
                        document.getElementById("detail-image-box")
                            .insertAdjacentHTML("beforeend", favoriteButtonHtml(item.id, item.is_favorite, "absolute top-2 right-2"));
                    })

                    .catch(err => console.error("データ取得エラー:", err));

                //編集画面へ移動（idを渡す）
                function goEdit() {
                    window.location.href = `edit.html?id=${id}`;
                }

                //削除して一覧画面へ戻る(server.jsのDELETE /api/clothes/:idに対応)
                function deleteItem() {
                    if (!confirm("この洋服を削除しますか？")) return;

                    fetch(`/api/clothes/${id}`, { method: "DELETE" })
                        .then(res => {
                            if (!res.ok) throw new Error("削除に失敗しました");
                            window.location.href = "list.html";
                        })
                        .catch(err => {
                            console.error("削除エラー:", err);
                            alert("削除に失敗しました");
                        });
                }
            </script>
</body>

</html>
