<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WearCast ホーム</title>
    <script src="https://kit.fontawesome.com/d4772c3c4b.js" crossorigin="anonymous"></script>
    <!-- フォント：Zen Maru Gothic（Google Fonts・ヘッダーのナビだけに使う） -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-100 min-h-screen">
    <div class="min-h-screen bg-gray-100 flex justify-center">
        <!-- 背景は天気に合わせて画像を切り替える（setWeatherBackgroundで設定） -->
        <div id="page" class="w-full max-w-2xl paper-bg bg-cover bg-center shadow-sm border border-gray-200">
            <header class="bg-sky-100 px-6 py-4 flex justify justify-between">
                <a href="index.html" class="flex items-center gap-2 text-gray-800 text-xl font-medium">
                    <img src="images/wearcast-icon-a-sunrise-tee.png" alt="WearCastのアイコン" class="w-8 h-8">
                    WearCast
                </a>
                <nav class="font-medium font-['Zen_Maru_Gothic',sans-serif]">
                    <a href="list.html" class="mr-3">洋服一覧</a>
                    <a href="register.html">洋服登録</a>
                </nav>
            </header>
            <main class="px-8 py-10">
                <!-- 都市検索ボックス -->
                <form id="search-form" class="w-full max-w-64 mb-6 ml-6">
                    <!-- 白い入力欄＋右端にえんじ色の検索ボタン（クリックでもEnterでも検索） -->
                    <div class="flex items-stretch bg-white border-2 border-[#5C1A1B] rounded-md overflow-hidden">
                        <input id="city-input" type="text" placeholder="都市を検索"
                            class="bg-transparent px-3 py-2 text-sm w-full outline-none placeholder-gray-400">
                        <button type="submit" aria-label="検索" class="bg-[#5C1A1B] text-white px-3 hover:opacity-80 transition">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </button>
                    </div>
                </form>

                <!-- 天気とおすすめコーディネート（スマホでは縦並び） -->
                <div class="flex flex-col md:flex-row gap-6">
                    <!-- 天気表示エリア -->
                    <div id="weather-area" class="w-full md:w-1/2 aspect-square bg-white/70 flex flex-col items-center justify-center">
                        <p id="weather-city" class="text-4xl font-medium"></p>
                        <p id="weather-temperature" class="text-7xl font-bold my-3"></p>
                        <p id="weather-text" class="text-2xl"></p>
                        <p id="weather-error" class="text-red-600"></p>
                    </div>

                    <!-- おすすめコーディネート表示エリア -->
                    <div class="w-full md:w-1/2 bg-white/70 px-6 py-8 flex flex-col items-center justify-center">
                        <h2 class="text-lg text-center leading-snug mb-6">今日のおすすめ<br>コーディネート</h2>
                        <div id="recommend-list" class="w-full flex flex-col items-center gap-2"></div>
                        <p id="recommend-error" class="text-red-600 text-sm"></p>
                    </div>
                </div>
            </main>
            <script>
                //都市名からサーバー経由で天気を取得して表示(server.jsの/api/weatherに対応)
                function showWeather(city) {
                    document.getElementById("weather-error").textContent = "";

                    fetch(`/api/weather?city=${encodeURIComponent(city)}`)
                        .then(res => {
                            if (!res.ok) return res.text().then(msg => { throw new Error(msg); });
                            return res.json();
                        })
                        .then(data => {
                            document.getElementById("weather-city").textContent = data.city;
                            document.getElementById("weather-temperature").textContent = data.temperature + "°";
                            document.getElementById("weather-text").textContent = data.weather;
                            setWeatherBackground(data.weather);
                            showRecommend(data.temperature);
                        })
                        .catch(err => {
                            console.error("天気取得エラー:", err);
                            document.getElementById("weather-error").textContent = err.message;
                        });
                }

                //天気の文字(server.jsのweatherNames)から背景画像を選ぶ（判定できなければ背景なし）
                //「雷雨」は雨より先、「にわか雪」は雪として判定する
                function setWeatherBackground(weather) {
                    let image = null;
                    if (weather.includes("雷")) image = "thunder.svg";
                    else if (weather.includes("雪")) image = "snowy.svg";
                    else if (weather.includes("雨")) image = "rainy.svg";
                    else if (weather.includes("晴")) image = "sunny.svg";
                    else if (weather.includes("曇") || weather.includes("霧")) image = "cloudy.svg";

                    const page = document.getElementById("page");
                    page.style.backgroundImage = image ? `url(images/weather/${image})` : "";
                    // 天気の画像には紙の質感を重ねない
                    page.style.backgroundBlendMode = image ? "normal" : "";
                }

                //気温に合わせたおすすめの服を表示(server.jsの/api/recommendに対応)
                function showRecommend(temperature) {
                    const list = document.getElementById("recommend-list");
                    const error = document.getElementById("recommend-error");
                    list.innerHTML = "";
                    error.textContent = "";

                    fetch(`/api/recommend?temperature=${temperature}`)
                        .then(res => {
                            if (!res.ok) return res.text().then(msg => { throw new Error(msg); });
                            return res.json();
                        })
                        .then(data => {
                            // 表示する順番（アウターは20°C以下のときだけ返ってくる）
                            const items = [
                                { key: "outer", category: "アウター" },
                                { key: "tops", category: "トップス" },
                                { key: "bottoms", category: "ボトムス" }
                            ].filter(({ key }) => key in data);

                            items.forEach(({ key, category }, index) => {
                                // 2着目以降の前に「＋」を入れる
                                if (index > 0) {
                                    const plus = document.createElement("p");
                                    plus.textContent = "＋";
                                    plus.className = "text-xl";
                                    list.appendChild(plus);
                                }
                                list.appendChild(createRecommendItem(data[key], category));
                            });
                        })
                        .catch(err => {
                            console.error("おすすめ取得エラー:", err);
                            error.textContent = err.message;
                        });
                }

                //おすすめの服1着分の表示を作る（画像のみ）（登録が無ければメッセージを出す）
                function createRecommendItem(item, category) {
                    if (!item) {
                        const empty = document.createElement("p");
                        empty.textContent = `この気温の${category}が登録されていません`;
                        empty.className = "text-sm text-gray-600 py-3";
                        return empty;
                    }

                    // クリックで詳細画面へ
                    const link = document.createElement("a");
                    link.href = `detail.html?id=${item.id}`;
                    link.title = item.name;
                    link.className = "hover:opacity-70 transition";

                    const imageBox = document.createElement("div");
                    imageBox.className = "w-24 h-24 bg-white flex items-center justify-center overflow-hidden";
                    if (item.image_path) {
                        const img = document.createElement("img");
                        img.src = item.image_path;
                        img.alt = item.name;
                        img.className = "w-full h-full object-cover";
                        imageBox.appendChild(img);
                    } else {
                        imageBox.innerHTML = '<span class="text-xs text-gray-400">No image</span>';
                    }

                    link.appendChild(imageBox);
                    return link;
                }

                //検索ボックスでEnterを押したら検索
                document.getElementById("search-form").addEventListener("submit", (e) => {
                    e.preventDefault();
                    const city = document.getElementById("city-input").value.trim();
                    if (city) showWeather(city);
                });

                //最初は東京を表示
                showWeather("東京");
            </script>
        </div>
    </div>
</body>

</html>
