<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WearCast ホーム</title>
    <script src="https://kit.fontawesome.com/d4772c3c4b.js" crossorigin="anonymous"></script>
    <!-- フォント：Zen Maru Gothic（Google Fonts・ヘッダーのナビだけに使う） -->
    <!-- ブラウザのタブとiPhoneのホーム画面に出すアイコン -->
    <link rel="icon" type="image/png" href="images/wearcast-logo.png">
    <link rel="apple-touch-icon" href="images/wearcast-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script src="auth-check.js"></script>
    <script src="loading.js"></script>
    <script src="weather-icons.js"></script>
    <script src="toast.js"></script>
</head>

<body class="bg-gray-100 min-h-screen">
    <div class="min-h-screen bg-gray-100 flex justify-center">
        <!-- 背景は天気に合わせて画像を切り替える（setWeatherBackgroundで設定） -->
        <div id="page" class="w-full max-w-2xl paper-bg bg-cover bg-center shadow-sm border border-gray-200">
            <header class="bg-sky-100 px-6 py-4 flex justify justify-between">
                <a href="index.html" class="flex items-center gap-2 text-gray-800 text-xl font-medium">
                    <img src="images/wearcast-logo.png" alt="WearCastのアイコン" class="w-8 h-8">
                    WearCast
                </a>
                <nav class="flex items-center font-medium font-['Zen_Maru_Gothic',sans-serif]">
                    <a href="list.html" class="mr-3">洋服一覧</a>
                    <a href="register.html">洋服登録</a>
                    <!-- ログアウト（押すと確認のダイアログを出す） -->
                    <button type="button" id="logout-open" aria-label="ログアウト" title="ログアウト" class="ml-3 text-gray-700 hover:opacity-60 transition">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </nav>
            </header>
            <main class="px-6 py-6 md:px-8 md:py-10">
                <!-- 都市検索ボックス -->
                <form id="search-form" class="w-full md:max-w-64 mb-4 md:mb-6 md:ml-6">
                    <!-- 白い入力欄＋右端にえんじ色の検索ボタン（クリックでもEnterでも検索） -->
                    <div class="flex items-stretch bg-white border-2 border-[#5C1A1B] rounded-md overflow-hidden">
                        <input id="city-input" type="text" placeholder="都市を検索"
                            class="bg-transparent px-3 py-2 text-base md:text-sm w-full outline-none placeholder-gray-400">
                        <button type="submit" aria-label="検索" class="bg-[#5C1A1B] text-white px-3 hover:opacity-80 transition">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </button>
                    </div>
                </form>

                <!-- 天気とおすすめコーディネート -->
                <!-- スマホ：スクロールしなくて済むように1枚のパネルに左右で並べる（左に天気・右におすすめ） -->
                <!-- PC：天気とおすすめを別々のパネルで横に並べる -->
                <div class="flex flex-row md:gap-6 bg-white/70 md:bg-transparent">
                    <!-- 天気表示エリア -->
                    <div id="weather-area" class="w-2/5 md:w-1/2 md:aspect-square md:bg-white/70 pt-6 md:pt-0 pl-6 pr-0 md:px-0 flex flex-col items-center justify-start md:justify-center text-center">
                        <p id="weather-city" class="text-xl md:text-4xl font-medium"></p>
                        <p id="weather-temperature" class="text-6xl md:text-7xl font-bold my-1 md:my-3"></p>
                        <!-- 天気の文字の下にアイコン（weather-icons.js） -->
                        <p id="weather-text" class="text-lg md:text-2xl"></p>
                        <div id="weather-icon" class="w-16 h-16 md:w-24 md:h-24 mt-1 empty:hidden"></div>
                        <p id="weather-error" class="text-red-600 text-sm md:text-base"></p>
                    </div>

                    <!-- おすすめコーディネート表示エリア -->
                    <div class="w-3/5 md:w-1/2 md:bg-white/70 px-3 py-6 md:px-6 md:py-8 flex flex-col items-center justify-center">
                        <h2 class="text-base md:text-lg font-medium text-center leading-snug mb-4 md:mb-6 font-['Zen_Maru_Gothic',sans-serif]">今日のおすすめ<br>コーディネート</h2>
                        <div id="recommend-list" class="w-full flex flex-col items-center gap-2"></div>
                        <p id="recommend-error" class="text-red-600 text-sm"></p>
                        <!-- 気に入らなかったら別の組み合わせを出す（showRecommendでボトムスの左下に移す・服が1着も無いときは出さない） -->
                        <button type="button" id="recommend-shuffle" class="hidden shrink-0 whitespace-nowrap px-4 py-2 rounded-full bg-[#4FC3F7] text-white text-sm font-medium items-center gap-2.5 hover:opacity-80 transition outline-none focus-visible:ring-2 focus-visible:ring-sky-300 disabled:opacity-50">
                            <i class="fa-solid fa-shuffle"></i>選びなおす
                        </button>
                    </div>
                </div>
            </main>

            <!-- ログアウトの確認ダイアログ（「ログアウト」でserver.jsのauth.jsの/logoutに送る） -->
            <dialog id="logout-dialog" class="done-modal-box w-[calc(100%-2rem)] max-w-sm bg-white border-[5px] border-[#5ad8e0] rounded-3xl shadow-xl px-6 pt-10 pb-8 text-center backdrop:bg-black/30">
                <p class="text-xl text-gray-900 mb-8 font-medium font-['Zen_Maru_Gothic',sans-serif]">ログアウトしますか？</p>
                <form action="/logout" method="post" class="flex justify-center gap-4">
                    <button type="button" id="logout-cancel" class="w-28 py-2 rounded-full bg-gray-200 text-gray-800 font-medium hover:opacity-80 transition outline-none focus-visible:ring-2 focus-visible:ring-sky-300">キャンセル</button>
                    <button type="submit" class="w-28 py-2 rounded-full bg-[#4FC3F7] text-white font-medium hover:opacity-80 transition outline-none focus-visible:ring-2 focus-visible:ring-sky-300">ログアウト</button>
                </form>
            </dialog>
            <script>
                //ログアウトの確認ダイアログ（キャンセルか、ダイアログの外側を押したら閉じる）
                const logoutDialog = document.getElementById("logout-dialog");
                document.getElementById("logout-open").addEventListener("click", () => logoutDialog.showModal());
                document.getElementById("logout-cancel").addEventListener("click", () => logoutDialog.close());
                logoutDialog.addEventListener("click", (e) => {
                    // ダイアログの余白を押したときもe.targetがダイアログになるので、外側かどうかは位置で調べる
                    const rect = logoutDialog.getBoundingClientRect();
                    const outside = e.clientX < rect.left || e.clientX > rect.right || e.clientY < rect.top || e.clientY > rect.bottom;
                    if (e.target === logoutDialog && outside) logoutDialog.close();
                });

                //ホームに戻ったら洋服一覧の絞り込みは解除する（ブラウザの戻るで来たときも動くようにpageshowを使う）
                window.addEventListener("pageshow", () => sessionStorage.removeItem("listState"));

                //都市名からサーバー経由で天気を取得して表示(server.jsの/api/weatherに対応)
                function showWeather(city, withLoading = false) {
                    document.getElementById("weather-error").textContent = "";

                    // 検索したときだけローディング画面を出す
                    if (withLoading) showLoading("天気を調べています");
                    fetch(`/api/weather?city=${encodeURIComponent(city)}`)
                        .then(res => {
                            if (!res.ok) return res.text().then(msg => { throw new Error(msg); });
                            return res.json();
                        })
                        .then(data => {
                            document.getElementById("weather-city").textContent = data.city;
                            document.getElementById("weather-temperature").textContent = data.temperature + "°";
                            document.getElementById("weather-text").textContent = data.weather;
                            document.getElementById("weather-icon").innerHTML = getWeatherIcon(data.weather);
                            setWeatherBackground(data.weather);
                            showRecommend(data.temperature);
                        })
                        .catch(err => {
                            console.error("天気取得エラー:", err);
                            document.getElementById("weather-error").textContent = err.message;
                        })
                        .finally(hideLoading);
                }

                //天気の文字(server.jsのweatherNames)から背景画像を選ぶ（判定できなければ背景なし）
                //「雷雨」は雨より先、「にわか雪」は雪として判定する
                function setWeatherBackground(weather) {
                    let image = null;
                    if (weather.includes("雷")) image = "thunder.svg";
                    else if (weather.includes("雪")) image = "snowy.svg";
                    else if (weather.includes("雨")) image = "rainy.svg";
                    else if (weather.includes("晴")) image = "sunny.svg";
                    else if (weather.includes("曇") || weather.includes("霧")) image = "cloudy.svg";

                    const page = document.getElementById("page");
                    page.style.backgroundImage = image ? `url(images/weather/${image})` : "";
                    // 天気の画像には紙の質感を重ねない
                    page.style.backgroundBlendMode = image ? "normal" : "";
                }

                //気温に合わせたおすすめの服を表示(server.jsの/api/recommendに対応)
                //シャッフルで使うので、今の気温と表示中の服のidを覚えておく
                let currentTemperature = null;
                let currentIds = [];
                //ボタンはおすすめの一覧の中に移すので、消えても使えるように最初に取っておく
                const shuffleButton = document.getElementById("recommend-shuffle");

                function showRecommend(temperature, shuffle = false) {
                    const list = document.getElementById("recommend-list");
                    const error = document.getElementById("recommend-error");
                    error.textContent = "";
                    currentTemperature = temperature;

                    // シャッフルのときは今の服を残したまま待つ（画面がちらつかないように）
                    if (!shuffle) {
                        list.innerHTML = "";
                        currentIds = [];
                        shuffleButton.classList.add("hidden");
                        shuffleButton.classList.remove("flex");
                    }
                    shuffleButton.disabled = true;

                    let url = `/api/recommend?temperature=${temperature}`;
                    if (shuffle && currentIds.length > 0) url += `&exclude=${currentIds.join(",")}`;

                    fetch(url)
                        .then(res => {
                            if (!res.ok) return res.text().then(msg => { throw new Error(msg); });
                            return res.json();
                        })
                        .then(data => {
                            list.innerHTML = "";
                            // 表示する順番（アウターは20°C以下のときだけ返ってくる）
                            const items = [
                                { key: "outer", category: "アウター" },
                                { key: "tops", category: "トップス" },
                                { key: "bottoms", category: "ボトムス" }
                            ].filter(({ key }) => key in data);

                            items.forEach(({ key, category }, index) => {
                                // 2着目以降の前に「＋」を入れる
                                if (index > 0) {
                                    const plus = document.createElement("p");
                                    plus.textContent = "＋";
                                    plus.className = "text-xl";
                                    list.appendChild(plus);
                                }
                                const item = createRecommendItem(data[key], category);

                                // 最後（ボトムス）の左に、下の端をそろえて「選びなおす」ボタンを置く
                                // 横の位置は気温の真ん中に合わせる（positionShuffleButton）・画像は上の服と同じく真ん中のまま
                                if (index === items.length - 1) {
                                    const row = document.createElement("div");
                                    row.className = "relative";
                                    shuffleButton.classList.add("absolute", "bottom-0");
                                    row.append(item, shuffleButton);
                                    list.appendChild(row);
                                } else {
                                    list.appendChild(item);
                                }
                            });

                            // 1着でも出ていれば選びなおせるようにする
                            currentIds = items.map(({ key }) => data[key]).filter(Boolean).map(item => item.id);
                            shuffleButton.classList.toggle("hidden", currentIds.length === 0);
                            shuffleButton.classList.toggle("flex", currentIds.length > 0);
                            positionShuffleButton();
                        })
                        .catch(err => {
                            console.error("おすすめ取得エラー:", err);
                            error.textContent = err.message;
                        })
                        .finally(() => { shuffleButton.disabled = false; });
                }

                //「選びなおす」ボタンの横の真ん中を、気温の数字の真ん中にそろえる
                //画面の幅で位置が変わるので、表示したときと画面の大きさが変わったときに計算し直す
                function positionShuffleButton() {
                    const row = shuffleButton.parentElement;
                    if (!row || shuffleButton.classList.contains("hidden")) return;
                    const temperatureRect = document.getElementById("weather-temperature").getBoundingClientRect();
                    const center = temperatureRect.left + temperatureRect.width / 2;
                    // 見た目でそろって見えるように、少し右（12px）にずらす
                    const left = center - row.getBoundingClientRect().left - shuffleButton.offsetWidth / 2 + 12;
                    shuffleButton.style.left = `${left}px`;
                }
                // アイコンやフォントがあとから読み込まれると、ボタンや気温の幅が変わって位置がずれる
                // なので、ボタン・気温・ページの大きさが変わるたびに合わせ直す
                const shuffleObserver = new ResizeObserver(positionShuffleButton);
                shuffleObserver.observe(shuffleButton);
                shuffleObserver.observe(document.getElementById("weather-temperature"));
                shuffleObserver.observe(document.documentElement);

                //シャッフルボタンを押したら、今と違う組み合わせを出す
                document.getElementById("recommend-shuffle").addEventListener("click", () => {
                    if (currentTemperature !== null) showRecommend(currentTemperature, true);
                });

                //おすすめの服1着分の表示を作る（画像のみ）（登録が無ければメッセージを出す）
                function createRecommendItem(item, category) {
                    if (!item) {
                        const empty = document.createElement("p");
                        empty.textContent = `この気温の${category}が登録されていません`;
                        empty.className = "text-sm text-gray-600 py-3";
                        return empty;
                    }

                    // クリックで詳細画面へ
                    const link = document.createElement("a");
                    link.href = `detail.html?id=${item.id}`;
                    link.title = item.name;
                    link.className = "hover:opacity-70 transition";

                    const imageBox = document.createElement("div");
                    imageBox.className = "w-32 h-32 md:w-24 md:h-24 bg-white flex items-center justify-center overflow-hidden";
                    if (item.image_path) {
                        const img = document.createElement("img");
                        img.src = item.image_path;
                        img.alt = item.name;
                        img.className = "w-full h-full object-cover";
                        imageBox.appendChild(img);
                    } else {
                        imageBox.innerHTML = '<span class="text-xs text-gray-400">No image</span>';
                    }

                    link.appendChild(imageBox);
                    return link;
                }

                //検索ボックスでEnterを押したら検索
                document.getElementById("search-form").addEventListener("submit", (e) => {
                    e.preventDefault();
                    const city = document.getElementById("city-input").value.trim();
                    if (city) showWeather(city, true);
                });

                //最初は東京を表示
                showWeather("東京");
            </script>
        </div>
    </div>
</body>

</html>
